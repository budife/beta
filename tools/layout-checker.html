<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  
  <!-- Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="eDM Helper Layout Checker - Test and validate your layouts">
  <meta name="keywords" content="edm, layout, checker, validation, tools">
  <meta name="author" content="eDM Helper">
  
  <!-- CSS -->
  <link rel="stylesheet" href="../css/theme.css?v=6.11.8">
  <link rel="stylesheet" href="../css/pages-layout-checker.css?v=6.11.8">
  <link rel="stylesheet" href="../css/controls.css?v=6.11.8">
  
  <title>Layout Checker - eDM Helper</title>
  <meta name="theme-color" content="#0f172a" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material.min.css" />
</head>
<body>
  <!-- Navigation Bar -->
  <header class="header" role="banner">
    <nav class="nav" role="navigation" aria-label="Main navigation">
      <!-- Home Button -->
      <div class="nav-left">
        <a href="../index.html" class="nav-link">
          <i class="fa-solid fa-home"></i>
          <span>Home</span>
        </a>
      </div>
      
      <div class="nav-right">
        <!-- Additional navigation items can be added here -->
      </div>
    </nav>
  </header>

<!-- Main Content -->
<main id="main-content" role="main">
  <div class="lc-workspace">
    <header class="lc-page-header">
      <div>
        <span class="lc-eyebrow">Layout validation</span>
        <h1><i class="fa-solid fa-ruler-combined"></i> Layout Checker</h1>
        <p>Load HTML, populate KRHRED values, and inspect the personalized layout before publishing.</p>
      </div>
      <span id="layoutStatus" class="lc-status" data-state="empty">No layout loaded</span>
    </header>

    <section class="lc-source-bar" aria-label="Layout source">
      <div class="lc-source-field">
        <label for="originalUrlInput">Layout URL</label>
        <input type="url" id="originalUrlInput" placeholder="https://mail.example.com/campaign/layout.html" class="lc-input" />
      </div>
      <div class="lc-source-actions">
        <label for="htmlFileInput" class="lc-btn lc-btn-secondary">
          <i class="fa-regular fa-file-code"></i> Open HTML
        </label>
        <input id="htmlFileInput" type="file" accept=".html,.htm,text/html" hidden>
        <button id="downloadBtn" class="lc-btn lc-btn-primary hidden"><i class="fa-solid fa-cloud-arrow-down"></i> Load URL</button>
        <button id="manualPasteBtn" class="lc-btn lc-btn-secondary hidden">Open URL</button>
        <button id="textModeBtn" class="lc-btn lc-btn-secondary hidden">Text Mode</button>
      </div>

      <div id="progressContainer" class="lc-inline-status hidden">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <span id="progressText">Processing...</span>
        <button id="stopBtn" class="lc-stop-btn" type="button">Stop</button>
      </div>
    </section>

    <div class="lc-main-layout">
      <aside class="lc-sidebar">
        <section class="lc-panel">
          <div class="lc-panel-heading">
            <div>
              <span class="lc-eyebrow">Customer data</span>
              <strong>Bulk KRHRED values</strong>
            </div>
            <div class="lc-panel-actions">
              <button id="resetKrhredBtn" class="lc-btn lc-btn-secondary lc-btn-sm">Reset</button>
              <button id="applyKrhredBtn" class="lc-btn lc-btn-primary lc-btn-sm">Apply</button>
            </div>
          </div>
          <textarea id="krhredInput" placeholder="Paste attr:KRHRED_Unit_XX and its value here." class="lc-textarea"></textarea>
        </section>

        <section id="krhredUnitsContainer" class="lc-panel lc-units-container">
          <div class="lc-panel-heading">
            <div>
              <span class="lc-eyebrow">Detected placeholders</span>
              <strong>KRHRED Units</strong>
            </div>
            <button id="addKrhredBtn" class="lc-btn lc-btn-secondary lc-btn-sm"><i class="fa-solid fa-plus"></i> Unit</button>
          </div>
          <div id="inputGrid" class="lc-input-grid">
            <div><input type="text" id="krhred_unit_30" name="krhred_unit_30" placeholder="30" class="lc-input-field" /></div>
            <div><input type="text" id="krhred_unit_31" name="krhred_unit_31" placeholder="31" class="lc-input-field" /></div>
            <div><input type="text" id="krhred_unit_32" name="krhred_unit_32" placeholder="32" class="lc-input-field" /></div>
            <div><input type="text" id="krhred_unit_33" name="krhred_unit_33" placeholder="33" class="lc-input-field" /></div>
            <div><input type="text" id="krhred_unit_34" name="krhred_unit_34" placeholder="34" class="lc-input-field" /></div>
            <div><input type="text" id="krhred_unit_35" name="krhred_unit_35" placeholder="35" class="lc-input-field" /></div>
            <div><input type="text" id="krhred_unit_36" name="krhred_unit_36" placeholder="36" class="lc-input-field" /></div>
            <div><input type="text" id="krhred_unit_37" name="krhred_unit_37" placeholder="37" class="lc-input-field" /></div>
          </div>
        </section>
      </aside>

      <section class="lc-editor-panel">
        <div class="lc-editor-toolbar">
          <div>
            <span class="lc-eyebrow">Source</span>
            <strong>HTML Content</strong>
          </div>
          <div class="lc-view-tabs" role="tablist" aria-label="Layout view">
            <button id="codeTabBtn" class="lc-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="codePanel">Code</button>
            <button id="previewTabBtn" class="lc-tab" type="button" role="tab" aria-selected="false" aria-controls="previewPanel">Preview</button>
          </div>
          <div class="lc-editor-actions">
            <label class="lc-toggle" for="highlightKrhredToggle">
              <input id="highlightKrhredToggle" type="checkbox">
              <span>Highlight KRHRED</span>
            </label>
          </div>
        </div>
        <div id="codePanel" class="lc-editor-body lc-view-panel is-active" role="tabpanel" aria-labelledby="codeTabBtn">
          <textarea id="htmlInput" placeholder="Paste HTML content here" class="lc-textarea lc-textarea-sm"></textarea>
        </div>
        <div id="previewPanel" class="lc-preview-panel lc-view-panel" role="tabpanel" aria-labelledby="previewTabBtn" hidden>
          <iframe id="layoutPreviewFrame" title="Layout preview" sandbox="allow-same-origin allow-popups"></iframe>
        </div>
      </section>
    </div>
  </div>
</main>

<!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer-content">
        <div class="footer-left">
          <p class="footer-text">&copy; <span id="footer-year">2025</span> eDM Helper crafted by <button class="creator-link" type="button" data-creator-modal>budd<span class="creator-popover" role="tooltip"><strong>meet the maker</strong></span></button></p>
        </div>
        <div class="footer-right">
          <nav class="footer-links" aria-label="Social media links">
            <a href="https://budd.my.id/" target="_blank" class="footer-link" aria-label="Website">
              <i class="fa-solid fa-globe"></i>
            </a>
            <a href="https://github.com/budife" target="_blank" class="footer-link" aria-label="GitHub">
              <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://instagram.com/budife.psd/" target="_blank" class="footer-link" aria-label="Instagram">
              <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://linkedin.com/in/budifelt/" target="_blank" class="footer-link" aria-label="LinkedIn">
              <i class="fa-brands fa-linkedin"></i>
            </a>
          </nav>
        </div>
      </div>
    </div>
  </footer>

<!-- CodeMirror JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="../js/footer.js" defer></script>
<script src="../js/version-config.js?v=6.11.8" defer></script>

</body>
</html>
