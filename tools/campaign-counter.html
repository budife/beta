<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  
  <!-- Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="eDM Helper Campaign Counter - Track your email campaign performance">
  <meta name="keywords" content="edm, campaign, counter, analytics, marketing">
  <meta name="author" content="eDM Helper">
  
  
  <!-- CSS -->
  <link rel="stylesheet" href="../css/theme.css?v=6.14.0">
  <link rel="stylesheet" href="../css/pages-campaign-counter.css?v=6.14.0">
  <link rel="stylesheet" href="../css/controls.css?v=6.14.0">
  
  <title>Campaign Counter - eDM Helper</title>
  <meta name="theme-color" content="#0f172a" />
  <!-- Font Awesome - Non-blocking load -->
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></noscript>
  
</head>
<body>
  <!-- Navigation Bar -->
  <header class="header" role="banner">
    <nav class="nav" role="navigation" aria-label="Main navigation">
      <div class="nav-left">
        <a href="../index.html" class="nav-link">
          <i class="fa-solid fa-home"></i>
          <span>Home</span>
        </a>
      </div>
      <div class="nav-right"></div>
    </nav>
  </header>

  <main id="main-content" role="main">
    <section class="campaign-section">
      <div class="container">
        <section class="counter-workspace" aria-label="Campaign counter workspace">
          <section class="counter-generator" aria-labelledby="counter-generator-title">
            <div class="counter-generator-body" id="counter-generator-body">
              <p class="counter-generator-title" id="counter-generator-title">Loading counter</p>
            </div>
          </section>

          <section class="folder-browser" aria-labelledby="folder-browser-title">
            <div class="folder-browser-header">
              <div>
                <span class="counter-eyebrow">Folder scan</span>
                <h1 id="folder-browser-title">Used Campaign IDs</h1>
                <p>Scan campaign folders named <code>XXXX Nama Campaign MM-DD Manager</code>.</p>
              </div>
              <div class="folder-browser-actions">
                <span class="counter-local-status" id="counter-local-status">Local only</span>
                <span class="counter-total" id="counter-total">0 used</span>
                <label class="counter-import-mode">
                  <span>Mode</span>
                  <select id="import-mode" aria-label="Folder scan mode">
                    <option value="replace">Replace scan</option>
                    <option value="merge">Merge</option>
                  </select>
                </label>
                <button type="button" class="counter-export-local" id="export-local">
                  <i class="fa-solid fa-download"></i> Export JSON
                </button>
                <button type="button" class="counter-reset-local" id="reset-local">
                  <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
                <button type="button" class="used-id-upload" id="scan-folder">
                  <i class="fa-solid fa-folder-open"></i> Scan folder
                </button>
              </div>
            </div>
            <p class="folder-selected" id="folder-selected">No folder scanned yet.</p>
            <p class="used-id-import-status" id="import-status" role="status" aria-live="polite"></p>
            <div class="counter-import-summary" id="import-summary" hidden></div>
            <div class="folder-id-list" id="series-counter-list" aria-live="polite">
              <p class="series-loading">Loading local Campaign IDs...</p>
            </div>
          </section>
        </section>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer-content">
        <div class="footer-left">
          <p class="footer-text">&copy; <span id="footer-year">2025</span> eDM Helper crafted by <button class="creator-link" type="button" data-creator-modal>budd<span class="creator-popover" role="tooltip"><strong>meet the maker</strong></span></button></p>
        </div>
        <div class="footer-right">
          <nav class="footer-links" aria-label="Social media links">
            <a href="https://budd.my.id/" target="_blank" class="footer-link" aria-label="Website">
              <i class="fa-solid fa-globe"></i>
            </a>
            <a href="https://github.com/budife" target="_blank" class="footer-link" aria-label="GitHub">
              <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://instagram.com/budife.psd/" target="_blank" class="footer-link" aria-label="Instagram">
              <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://linkedin.com/in/budifelt/" target="_blank" class="footer-link" aria-label="LinkedIn">
              <i class="fa-brands fa-linkedin"></i>
            </a>
          </nav>
        </div>
      </div>
    </div>
  </footer>

  <script src="../js/footer.js?v=6.14.0" defer></script>
  <script src="../js/version-config.js?v=6.14.0" defer></script>
  <script src="../js/campaign-id-core.js?v=6.14.0" defer></script>
  <script src="../js/campaign-id-local-store.js?v=6.14.0" defer></script>
  <script src="../js/pages-campaign-counter.js?v=6.14.0" defer></script>
</body>
</html>
