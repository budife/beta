<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campaign ID Bridge</title>
</head>
<body>
<script>
(() => {
  const SUPABASE_URL = 'https://neuyjcotcmjnndjyzbcq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_BGon7fPsvXNe59meFE9F4Q_SbjCa-Dp';
  const CAMPAIGN_TYPE = 'campaign1';

  function headers(extra) {
    return Object.assign({
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    }, extra || {});
  }

  async function loadIds() {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/campaign_id_allocations`
        + `?select=sequence_number&campaign_type=eq.${CAMPAIGN_TYPE}`
        + '&status=in.(reserved,used)&order=sequence_number.asc',
      { headers: headers() }
    );
    const data = await response.json();
    if (!response.ok) throw Object.assign(new Error(data?.message || `HTTP ${response.status}`), data);
    return data;
  }

  async function reserve(payload) {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/campaign_id_allocations?select=sequence_number`,
      {
        method: 'POST',
        headers: headers({ Prefer: 'return=representation' }),
        body: JSON.stringify({
          campaign_type: CAMPAIGN_TYPE,
          sequence_number: payload.sequenceNumber,
          campaign_name: payload.campaignName,
          source: 'monday-bookmarklet',
          status: 'used'
        })
      }
    );
    const data = await response.json();
    if (!response.ok) throw Object.assign(new Error(data?.message || `HTTP ${response.status}`), data);
    return data;
  }

  window.addEventListener('message', async event => {
    if (event.source !== window.parent || event.data?.source !== 'edm-campaign-id-panel') return;
    const { id, action, payload } = event.data;
    try {
      const data = action === 'load' ? await loadIds() : await reserve(payload || {});
      event.source.postMessage({ source: 'edm-campaign-id-bridge', id, ok: true, data }, event.origin);
    } catch (error) {
      event.source.postMessage({
        source: 'edm-campaign-id-bridge',
        id,
        ok: false,
        error: error.message,
        code: error.code
      }, event.origin);
    }
  });
})();
</script>
</body>
</html>
